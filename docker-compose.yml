x-airflow-common: &airflow-common
  image: weather-airflow:3.1.8-spark4.0.5
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  env_file: .env
  environment:
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-weather-local-development-secret-only}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW_CONN_AWS_DEFAULT: >-
      {"conn_type":"aws","login":"${MINIO_ROOT_USER}","password":"${MINIO_ROOT_PASSWORD}","extra":{"endpoint_url":"http://minio:9000","region_name":"us-east-1"}}
    AIRFLOW_CONN_SPARK_DEFAULT: >-
      {"conn_type":"spark","host":"spark://spark-master","port":7077,"extra":{"deploy-mode":"client"}}
    AIRFLOW_CONN_WEATHER_POSTGRES: >-
      {"conn_type":"postgres","host":"postgres","port":5432,"schema":"weather","login":"${POSTGRES_USER}","password":"${POSTGRES_PASSWORD}"}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./spark/jobs:/opt/airflow/spark/jobs:ro
    - airflow-logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:18-alpine
    env_file: .env
    environment:
      POSTGRES_DB: airflow
    volumes:
      - postgres18-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    pull_policy: never
    env_file: .env
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    <<: *airflow-common
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["python", "-c"]
    command:
      - |
        import os
        import boto3

        client = boto3.client(
            "s3",
            endpoint_url="http://minio:9000",
            region_name="us-east-1",
            aws_access_key_id=os.environ["MINIO_ROOT_USER"],
            aws_secret_access_key=os.environ["MINIO_ROOT_PASSWORD"],
        )
        if not any(bucket["Name"] == "weather-data" for bucket in client.list_buckets()["Buckets"]):
            client.create_bucket(Bucket="weather-data")

  spark-master:
    image: spark:4.0.5-java21-python3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "8081:8080"
      - "7077:7077"

  spark-worker:
    image: spark:4.0.5-java21-python3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "2", "--memory", "1g", "spark://spark-master:7077"]
    depends_on:
      - spark-master

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        airflow users reset-password --username airflow --password airflow ||
          airflow users create --username airflow --password airflow --role Admin \
            --firstname Airflow --lastname Admin --email admin@example.com
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: ["api-server"]
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    depends_on:
      airflow-apiserver:
        condition: service_healthy
      airflow-dag-processor:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started

volumes:
  postgres18-data:
  minio-data:
  airflow-logs:
